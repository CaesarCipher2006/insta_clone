<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: 350px;
    }
    .login-box {
      background-color: #fff;
      border: 1px solid #dbdbdb;
      padding: 40px;
      text-align: center;
    }
    .logo {
      margin-bottom: 30px;
    }
    .logo img {
      width: 175px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid #dbdbdb;
      border-radius: 3px;
      background-color: #fafafa;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3897f0;
      color: white;
      border: none;
      border-radius: 3px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .or {
      margin: 20px 0;
      position: relative;
      text-align: center;
      color: #999;
    }
    .or::before, .or::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background-color: #dbdbdb;
    }
    .or::before {
      left: 0;
    }
    .or::after {
      right: 0;
    }
    .facebook-login {
      color: #385185;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
    .forgot {
      font-size: 12px;
      color: #00376b;
      margin-top: 12px;
      cursor: pointer;
    }
    .signup-box {
      margin-top: 10px;
      text-align: center;
      font-size: 14px;
      border: 1px solid #dbdbdb;
      padding: 20px;
      background-color: #fff;
    }
    .signup-box a {
      color: #3897f0;
      font-weight: bold;
      text-decoration: none;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      text-align: center;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-box">
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram Logo">
      </div>
      <form>
        <input type="text" placeholder="Phone number, username, or email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
      <div class="or">OR</div>
      <div class="facebook-login">Log in with Facebook</div>
      <div class="forgot">Forgot password?</div>
    </div>
    <div class="signup-box">
      Don't have an account? <a href="#">Sign up</a>
    </div>
    <div class="footer">
      © 2025 Instagram from Meta
    </div>
  </div>
</body>
</html>
